{% extends "admin/admin_base.html" %}{% block admin_content %}<section class="admin-wrap"><div class="admin-heading"><div><span class="eyebrow">SHOP STRUCTURE</span><h1>Room <em>collections.</em></h1></div></div><nav class="admin-nav"><a href="{{ url_for('admin.dashboard') }}">Overview</a><a href="{{ url_for('admin.products') }}">Products</a><a class="active" href="{{ url_for('admin.categories') }}">Categories</a><a href="{{ url_for('admin.orders') }}">Orders</a></nav><form class="admin-form compact-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Create category</h2><label>Category name<input name="name" required placeholder="Living room"></label><label>Description<input name="description"></label><button class="button button-dark">Add category</button></form><div class="admin-table">{% for c in categories %}<div class="admin-row"><strong>{{ c.name }}</strong><span>{{ c.products|length }} products</span></div>{% endfor %}</div></section>{% endblock %}
